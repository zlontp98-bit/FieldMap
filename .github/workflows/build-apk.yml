name: Build APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'test — пробная сборка (релиз latest); stable — обновление для всех (релиз stable)'
        type: choice
        options: [test, stable]
        default: test
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -euo pipefail
          unzip -q fieldmap_v3.zip -d extracted_files

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          set -euo pipefail

          PROJECT_SETTINGS=$(find extracted_files -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "::error::Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          # страница приложения одним файлом (загрузчик + app.html) из исходников web/
          python3 apk-port/bundle.py "$PROJECT_DIR"

          gradle -p "$PROJECT_DIR" assembleDebug \
            --no-daemon --stacktrace

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file not found: $APK_PATH"
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          cp "$APK_PATH" FieldMap.apk
          ls -lh FieldMap.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldMap-APK
          path: FieldMap.apk
          if-no-files-found: error
          retention-days: 14

      # Обновление без APK: рядом с APK выкладываются web.html (страница приложения) и update.json (описание обновления).
      # Приложение читает update.json из релиза stable (все телефоны) или latest (пробные версии).
      - name: Update manifest
        run: |
          set -euo pipefail
          TAG=latest
          if [ "${{ inputs.channel }}" = "stable" ]; then TAG=stable; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python3 apk-port/manifest.py "$PROJECT_DIR" FieldMap.apk "$TAG" "$GITHUB_SHA"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$TAG" = "stable" ] && gh release view stable >/dev/null 2>&1; then
            # релиз для всех не удаляем (телефоны проверяют его постоянно): заменяем файлы, описание — последним
            gh release upload stable FieldMap.apk web.html --clobber
            gh release upload stable update.json --clobber
            gh release edit stable --notes "Обновление для всех телефонов. Сборка из commit ${GITHUB_SHA}"
          else
            gh release delete "$TAG" --yes --cleanup-tag || true
            if [ "$TAG" = "stable" ]; then
              TITLE="FieldMap — обновление для всех"; NOTES="Обновление для всех телефонов. Сборка из commit ${GITHUB_SHA}"
            else
              TITLE="FieldMap APK"; NOTES="Automatic debug build from commit ${GITHUB_SHA}"
            fi
            gh release create "$TAG" FieldMap.apk web.html update.json \
              --title "$TITLE" --notes "$NOTES" --target "${GITHUB_SHA}"
          fi
