name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show all files
        run: |
          echo "Содержимое корня репозитория:"
          ls -la
          echo "Распаковываем архив:"
          unzip -q fieldmap_v3.zip -d extracted_files
          echo "Содержимое после распаковки:"
          find extracted_files -maxdepth 3
